name: Release APK

# Every push builds the APK, then tags the commit v1.0.<run number> and publishes a GitHub release.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Pick version
        id: version
        run: |
          echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "syncaudio-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SyncAudio ${{ steps.version.outputs.tag }}
          body: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: syncaudio-${{ steps.version.outputs.tag }}.apk
